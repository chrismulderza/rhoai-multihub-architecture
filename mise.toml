# Docs: https://mise.jdx.dev/configuration.html
# min_version is the mise release that verifies this repository.
min_version = "2026.9.15"

[settings]
lockfile = true

[settings.task]
run_auto_install = false
quiet = true

[task_config]
dir = "{{config_root}}"

[tools]
python = "3.14.8"
uv = "0.13.1"
dprint = "0.63.0"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
alias = "i"
description = "Sync MkDocs packages from requirements.lock into .venv"
sources = ["requirements.txt", "requirements.lock"]
outputs = [".venv/.deps-synced"]
run = ["uv pip sync --python .venv/bin/python requirements.lock", "touch .venv/.deps-synced"]

[tasks."lock:requirements"]
description = "Regenerate requirements.lock from requirements.txt with hashes for Python 3.14"
sources = ["requirements.txt"]
outputs = ["requirements.lock"]
run = "uv pip compile requirements.txt --universal --python-version 3.14 --generate-hashes --output-file requirements.lock"

[tasks.format]
alias = "f"
description = "Format Markdown, JSON, TOML, and YAML"
depends = ["format:dprint"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, and YAML with dprint"
run = "dprint fmt --allow-no-files"

[tasks."check:format"]
description = "Check Markdown, JSON, TOML, and YAML formatting with dprint"
run = "dprint check"

[tasks."build:docs"]
description = "Build the MkDocs site in strict mode. Exits non-zero on broken links or markdown errors."
depends = ["install"]
sources = ["mkdocs.yml", "docs/**/*.md", "docs/**/*.css", "requirements.lock"]
outputs = ["site/index.html"]
run = "mkdocs build --strict"

[tasks.build]
alias = "b"
description = "Build the documentation site"
depends = ["build:docs"]

[tasks."serve:docs"]
alias = "w"
description = "Preview the documentation site with MkDocs live reload"
depends = ["install"]
raw = true
run = "mkdocs serve --strict"

[tasks.check]
alias = "c"
description = "Run documentation static checks"
depends = ["check:format", "build:docs"]

[tasks.all]
alias = "a"
description = "Format sources, then run the documentation checks"
run = ["mise run format", "mise run check"]
