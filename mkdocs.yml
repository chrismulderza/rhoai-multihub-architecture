site_name: "RHOAI Multi-Cluster MaaS Architecture"

exclude_docs: |
  adr/**

theme:
  name: material
  font:
    text: Red Hat Display
    code: Red Hat Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/redhat_brand.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite

plugins:
  - search
  - mermaid2

nav:
  - Home: index.md
  - Executive:
      - Executive summary: executive/executive-summary.md
      - Business value and TCO: executive/business-value-tco.md
      - SLA and disaster recovery: executive/sla-dr-strategy.md
  - Architecture:
      - Global topology: architecture/global-topology.md
      - Data center 1 H100: architecture/datacenter-1-h100.md
      - Data center 2 L40S: architecture/datacenter-2-l40s.md
      - MaaS gateway: architecture/maas-gateway-kuadrant.md
      - Storage and networking: architecture/storage-networking.md
