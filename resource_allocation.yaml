      bandwidth_gbps: 8000
    interconnect:
      type: "NVLink 5"
      bidirectional_bandwidth_gbps: 1800
    partitioning_capabilities:
      mig_supported: true
      mig_profiles: ["1g.24gb", "2g.48gb", "3g.96gb", "4g.96gb", "7g.192gb"]
      time_slicing_supported: true
    rhoai_integration:
