# ==============================================================================
# 2. TOPOLOGY & UNPARTITIONED CLUSTER HARDWARE INVENTORY
# ==============================================================================
topology:
  inter_datacenter_wan:
    bandwidth_gbps: 10
    latency_ms: 12
    encryption: "IPsec / MACsec"

  datacenters:
    # --------------------------------------------------------------------------
    # Data Center 1: Core Training & Heavy Reasoning Hub
    # --------------------------------------------------------------------------
    - name: "datacenter-1-core"
      location: "Primary-HQ"
      cluster_metadata:
        openshift_version: "4.19"
        rhoai_version: "3.5"
        ingress_domain: "apps.dc1.domain.com"
      storage_fabrics:
        - name: "cephfs-rwx-nvme"
          type: "OpenShift Data Foundation (ODF)"
          access_mode: "ReadWriteMany"
          capacity_tb: 50
          mount_path: "/mnt/models"
          iops: 120000
        - name: "object-store-s3"
          type: "Ceph RadosGW"
          endpoint: "https://s3.dc1.domain.com"
          bucket: "rhoai-model-registry"
      networking:
        pod_network_cni: "OVN-Kubernetes"
        secondary_fabric: "RoCEv2 200Gbps"
      nodes:
        - name: "worker-h100-node1"
          role: "heavy-inference-training"
          host_specs:
            cpu_cores: 128
            system_memory_gb: 1024
          accelerator_configuration:
            catalog_ref: "nvidia_h100_sxm"
            installed_count: 8
            interconnect_topology: "NVSwitch Full Mesh (900 GB/s)"

        - name: "worker-h100-node2"
          role: "hybrid-serving-dev-failover"
          host_specs:
            cpu_cores: 128
            system_memory_gb: 1024
          accelerator_configuration:
            catalog_ref: "nvidia_h100_sxm"
            installed_count: 8
            interconnect_topology: "NVSwitch Full Mesh (900 GB/s)"

    # --------------------------------------------------------------------------
    # Data Center 2: Horizontal Scale-Out Inference & Speech Hub
    # --------------------------------------------------------------------------
    - name: "datacenter-2-scale"
      location: "Secondary-Colo"
      cluster_metadata:
        openshift_version: "4.19"
        rhoai_version: "3.5"
        ingress_domain: "apps.dc2.domain.com"
      storage_fabrics:
        - name: "cephfs-rwx-storage"
          type: "OpenShift Data Foundation (ODF)"
          access_mode: "ReadWriteMany"
          capacity_tb: 30
          mount_path: "/mnt/models"
          iops: 60000
        - name: "object-store-s3"
          type: "Ceph RadosGW (Asynchronously mirrored with DC1)"
          endpoint: "https://s3.dc2.domain.com"
          bucket: "rhoai-model-registry"
      networking:
        pod_network_cni: "OVN-Kubernetes"
        secondary_fabric: "PCIe Gen4 / 100Gbps Ethernet"
      nodes:
        - name: "worker-l40s-node1"
          role: "vision-serving-training"
          host_specs:
            cpu_cores: 64
            system_memory_gb: 512
          accelerator_configuration:
            catalog_ref: "nvidia_l40s"
            installed_count: 4
            interconnect_topology: "PCIe Gen4 x16 Switch (No NVLink)"

        - name: "worker-l40s-node2"
          role: "vision-serving-training"
          host_specs:
            cpu_cores: 64
            system_memory_gb: 512
          accelerator_configuration:
            catalog_ref: "nvidia_l40s"
            installed_count: 4
            interconnect_topology: "PCIe Gen4 x16 Switch (No NVLink)"

        - name: "worker-l40s-node3"
          role: "horizontal-llm-serving"
          host_specs:
            cpu_cores: 64
            system_memory_gb: 512
          accelerator_configuration:
            catalog_ref: "nvidia_l40s"
            installed_count: 4
            interconnect_topology: "PCIe Gen4 x16 Switch (No NVLink)"

        - name: "worker-l40s-node4"
          role: "audio-sts-embeddings-serving"
          host_specs:
            cpu_cores: 64
            system_memory_gb: 512
          accelerator_configuration:
            catalog_ref: "nvidia_l40s"
            installed_count: 4
            interconnect_topology: "PCIe Gen4 x16 Switch (No NVLink)"