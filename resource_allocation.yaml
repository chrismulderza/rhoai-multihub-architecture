# ==============================================================================
# ENTERPRISE AI ACCELERATOR & CLUSTER RESOURCE SPECIFICATION
# Schema: resource_specification.yaml
# Compatibility: Red Hat OpenShift AI (RHOAI) / OpenShift Container Platform (OCP)
# ==============================================================================
version: "v1alpha2"
metadata:
  name: "enterprise-rhoai-resource-catalog"
  description: "Raw hardware capabilities, certified accelerator catalog, and cluster inventories for dynamic RHOAI allocation"

# ==============================================================================
